<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#0b0d0e"><meta name="format-detection" content="telephone=no"><link rel="preload" href="/book/fonts/oswald-latin.woff2" as="font" type="font/woff2" crossorigin><link rel="icon" href="/book/muk-badge-logo.png"><title>MUK Talent · Personal business card</title><link rel="stylesheet" href="/book/business-card.css"><link rel="stylesheet" href="/book/style.css"><script type="module" src="/book/app.js"></script></head><body><main><div class="public-top"><a href="/" class="public-brand" aria-label="MUK Talent home">MUK TALENT</a><button id="openBooking" class="book-call" type="button" hidden>Book an appointment ↗</button></div><div id="publicIdentity"><p class="public-status">Preparing your business card…</p></div><div id="cardActions" class="public-actions" hidden><button id="ctaBook" class="public-cta public-cta-gold" type="button">Book appointment</button><button id="ctaWallet" class="public-cta" type="button">Add to Wallet</button></div><div id="cardSocial"></div><div id="cardTools"></div><section id="cardAbout" class="public-about" hidden></section><div id="scrollQr"></div><section id="bookingPanel" hidden><div class="booking-top"><h1>Let’s talk about your next step.</h1><button id="closeBooking" type="button">Back to card</button></div><p>Choose a time for a 30-minute consultation. Monday–Friday, 09:00–17:00 Morocco time. In-person location must be confirmed with your counsellor.</p><form id="bookingForm"><label>Date<input id="day" type="date" required></label><button id="loadSlots" type="button">Find available times</button><label>Time · Morocco<select id="slot" required><option value="">Choose a date first</option></select></label><p id="ukTime"></p><div class="booking-columns"><label>First name<input name="first_name" maxlength="150" autocomplete="given-name" required></label><label>Last name<input name="last_name" maxlength="150" autocomplete="family-name" required></label></div><label>Email<input name="email" type="email" maxlength="320" autocomplete="email" required></label><label>Phone / WhatsApp<input name="phone" type="tel" placeholder="+212…" pattern="\+[1-9][0-9]{6,14}" maxlength="16" required></label><label>Institution (optional)<input name="institution" maxlength="300"></label><label>Consultation type<select name="mode"><option value="phone">Phone consultation</option><option value="in_person">In person · location to be confirmed</option></select></label><label>What would you like to discuss?<textarea name="subject" maxlength="1000" required></textarea></label><label class="booking-trap" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><label class="booking-consent"><input name="consent" type="checkbox" required>I have read the privacy notice and agree to be contacted about this appointment.</label><a href="/privacy/" target="_blank" rel="noopener">Privacy notice</a><button id="confirm" type="submit">Confirm appointment</button></form></section><p id="status" class="public-status" role="status" aria-live="polite"></p></main></body></html>
